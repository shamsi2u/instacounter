<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Followers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#10233a;--ink:#f3efe6;--muted:#8ea3bb;--brass:#c9a227;--up:#7fd1a8;--down:#ef8a7a}
@media (prefers-color-scheme: light){:root{--bg:#e9eef4;--ink:#10233a;--muted:#5b6f86;--brass:#9a7a12;--up:#1f8a5b;--down:#b9432f}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;display:grid;place-items:center;cursor:pointer}
main{text-align:center;padding:4vmin}
.who{display:flex;align-items:center;justify-content:center;gap:.7em;font-size:clamp(1rem,2.4vw,1.6rem);font-weight:600;color:var(--muted)}
.who img{width:1.8em;height:1.8em;border-radius:50%;border:2px solid var(--brass)}
.count{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;font-size:clamp(5rem,22vw,20rem);line-height:1;display:flex;justify-content:center;margin:.08em 0 .12em;font-variant-numeric:tabular-nums}
.d{height:1em;overflow:hidden;display:inline-block}
.strip{display:flex;flex-direction:column;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.strip span,.sep{height:1em;display:block}
.sep{color:var(--brass);width:.28em}
.meta{display:flex;gap:2em;justify-content:center;font-size:clamp(.9rem,1.8vw,1.25rem);color:var(--muted)}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}
.err{color:var(--down);margin-top:1em;font-size:1rem}
@media (prefers-reduced-motion: reduce){.strip{transition:none}}
</style>
</head>
<body title="Click for fullscreen">
<main>
  <div class="who"><img id="av" alt="" hidden><span id="user">Connecting…</span></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="meta"><span class="delta" id="delta"></span><span id="ts"></span></div>
  <div class="err" id="err" hidden></div>
</main>
<script>
const POLL_MS = 30000;
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US');
let shown = '';

function render(n){
  const s = fmt(n), box = $('count');
  if (s.length !== shown.length){            // rebuild on digit-count change
    box.innerHTML = '';
    for (const ch of s){
      if (/\d/.test(ch)){
        const d = document.createElement('span'); d.className='d';
        d.innerHTML = '<span class="strip">' + [...'0123456789'].map(x=>`<span>${x}</span>`).join('') + '</span>';
        box.append(d);
      } else { const c=document.createElement('span'); c.className='sep'; c.textContent=ch; box.append(c); }
    }
    void box.offsetWidth;
  }
  const strips = box.querySelectorAll('.strip');
  [...s.replace(/\D/g,'')].forEach((dg,i)=>{ strips[i].style.transform = `translateY(-${dg*10}%)`; });
  shown = s;
}

function delta(n){
  const key = 'base-' + new Date().toISOString().slice(0,10);
  let base; try { base = +localStorage.getItem(key); if(!base){ localStorage.setItem(key,n); base=n; } } catch { base = n; }
  const d = n - base, el = $('delta');
  el.textContent = (d>=0?'+':'') + fmt(d) + ' today';
  el.className = 'delta ' + (d>0?'up':d<0?'down':'');
}

async function tick(){
  try{
    const r = await fetch('/api/count', {cache:'no-store'});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    $('user').textContent = '@' + j.username;
    if (j.avatar){ $('av').src = j.avatar; $('av').hidden = false; }
    render(j.followers); delta(j.followers);
    $('ts').textContent = 'Updated ' + new Date(j.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    $('err').hidden = true;
  }catch(e){ $('err').textContent = 'Can’t reach Instagram: ' + e.message + '. Retrying in 30s.'; $('err').hidden = false; }
}

document.body.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
tick(); setInterval(tick, POLL_MS);
</script>
</body>
</html>
